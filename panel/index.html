<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>orcaDeck</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="topbar">
    <div id="topbar-title">
      <span class="orca-mark">🐋</span>
      <span>orcaDeck</span>
    </div>
    <div id="topbar-status" class="muted">connecting…</div>
  </header>

  <main id="app">
    <div id="empty" class="empty-state" hidden>No worktrees discovered.</div>
  </main>

  <div id="token-banner" class="banner" hidden>
    Not paired with orcad. Open the LAN link printed in the orcad console (it carries a token),
    once, on this device.
  </div>

  <script src="/panel.js"></script>
</body>
</html>
