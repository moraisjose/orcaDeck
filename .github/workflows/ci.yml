name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  panel:
    # The panel's status ladder is plain JS with no build step, so it tests
    # under node's own runner — no toolchain beyond the one the runner ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test "tests/*.test.js"
